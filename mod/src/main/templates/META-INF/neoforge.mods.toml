modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Eiriksb/they-will-talk/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Villagers talk back. Speak to vanilla villagers, MCA Reborn villagers and MineColonies citizens through
Simple Voice Chat (transcribed by Sipher) or chat, and they answer out loud with their own voice,
personality and memories, powered by a local AI model running on the server's GPU. Includes an admin
dashboard with villager search, conversation history, family trees and a BlueMap-powered map.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="voicechat_api"
    type="optional"
    versionRange="[2.6.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sipher"
    type="optional"
    versionRange="[${sipher_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mca"
    type="optional"
    versionRange="[7.7,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="bluemap"
    type="optional"
    versionRange="[5.0,)"
    ordering="AFTER"
    side="BOTH"
